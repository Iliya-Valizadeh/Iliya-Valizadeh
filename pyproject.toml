[project]
name = "github-profile"
version = "0.1.0"
description = "Renders README.md from numbers other repos already claim in their own CLAIMS.md"
readme = "README.md"
requires-python = ">=3.11"
# Per ADR 0001, scripts/render_readme.py needs nothing beyond the standard library
# at run time.
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "textstat>=0.7.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=scripts --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"
# tools/ is copied byte for byte from ds-project-standard per ADR 0004 and checked
# there, not here.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["scripts", "tests"]
